services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartqa-postgres
    environment:
      POSTGRES_USER: smartqa
      POSTGRES_PASSWORD: smartqa
      POSTGRES_DB: smartqa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartqa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
