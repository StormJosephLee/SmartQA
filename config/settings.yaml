# 非敏感的可调参数（敏感项一律走 .env）
retrieval:
  vector_top_k: 20
  bm25_top_k: 20
  rrf_k: 60
  rerank_top_n: 5
  min_score: 0.0
  max_bm25_corpus: 5000

chunking:
  default: { strategy: recursive, size: 512, overlap: 64 }
  report: { strategy: semantic, size: 768, overlap: 0 }
  table: { strategy: table }
  code: { strategy: code, size: 1024, overlap: 64 }

agent:
  max_reflect: 3
  # 最大反思/检索轮次：直接决定 Agent 模式下串行 LLM 调用次数的上限，越大越容易超时
  max_rounds: 3
  tool_timeout: 10
  # Agent 整体超时（秒）：超时后降级为直答，避免 prepare 阶段无限等待
  timeout: 60
  # 状态机最大节点执行数，防止图意外循环时打不出去
  recursion_limit: 30
  # prepare 阶段 SSE 心跳间隔（秒），需小于客户端读超时
  heartbeat_interval: 10

memory:
  max_turns: 10
  max_chars: 4000
  # ---- 长期记忆（详见 docs/memory_design.md）----
  # 总开关：关闭后既不沉淀也不注入
  long_term_enabled: true
  # 是否用 LLM 从对话抽取记忆；关闭后只能通过 API 手动写入
  extract_enabled: true
  # 单次注入上下文的条数上限
  inject_top_k: 5
  # pgvector 候选召回数，需 >= inject_top_k
  recall_top_k: 20
  # 单用户记忆总量上限，超出按「最久未命中且未置顶」淘汰
  max_items_per_user: 200
  # 余弦距离阈值（pgvector <=> 越小越相似），低于它视为重复，更新而非新增
  dedupe_distance: 0.12
  # 允许写入的类别白名单
  allowed_kinds: [profile, preference, fact, instruction]

security:
  max_input_chars: 4000
  forbidden_patterns:
    - "忽略以上指令"
    - "ignore previous instructions"
    - "忽略之前的"
    - "system prompt"
    - "reveal your prompt"
