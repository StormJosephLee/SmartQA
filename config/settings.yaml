# 非敏感的可调参数（敏感项一律走 .env）
retrieval:
  vector_top_k: 20
  bm25_top_k: 20
  rrf_k: 60
  rerank_top_n: 5
  min_score: 0.0
  max_bm25_corpus: 5000

chunking:
  default: { strategy: recursive, size: 512, overlap: 64 }
  report: { strategy: semantic, size: 768, overlap: 0 }
  table: { strategy: table }
  code: { strategy: code, size: 1024, overlap: 64 }

agent:
  max_reflect: 3
  # 最大反思/检索轮次：直接决定 Agent 模式下串行 LLM 调用次数的上限，越大越容易超时
  max_rounds: 3
  tool_timeout: 10
  # Agent 整体超时（秒）：超时后降级为直答，避免 prepare 阶段无限等待
  timeout: 60
  # 状态机最大节点执行数，防止图意外循环时打不出去
  recursion_limit: 30
  # prepare 阶段 SSE 心跳间隔（秒），需小于客户端读超时
  heartbeat_interval: 10

memory:
  max_turns: 10
  max_chars: 4000

security:
  max_input_chars: 4000
  forbidden_patterns:
    - "忽略以上指令"
    - "ignore previous instructions"
    - "忽略之前的"
    - "system prompt"
    - "reveal your prompt"
