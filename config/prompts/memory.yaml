# 长期记忆相关模板（设计见 docs/memory_design.md#3）
# 占位符由 str.format 填充，故 JSON 示例需写成 {{ }} 以免被吃掉

# 召回记忆注入 system prompt 时的引导语
inject_header: |
  以下是关于该用户的长期记忆，回答时请自然参考，但不要向用户逐条复述这些内容：

# 从一轮对话抽取值得长期留存的记忆；输出 JSON 数组
extract_template: |
  你是 SmartQA 的记忆抽取器。阅读下面这轮对话，提取**值得长期记住**的用户信息。

  值得记住的：
  - 用户基本信息（姓名、职能、所属团队）
  - 稳定的偏好与习惯（沟通语言、回答详略、偏好的输出格式）
  - 用户明确希望记住的事实或长期指令
  不要记住的：
  - 一次性问题本身及其答案
  - 敏感信息（密码、密钥、证件号、银行卡号）

  只输出 JSON 数组，每项形如 {{"kind": "fact", "content": "用户是后端工程师"}}。
  kind 只能是以下之一：
    profile     用户画像（身份、职能、团队）
    preference  偏好（表达风格、格式、语言）
    fact        用户陈述的持久事实
    instruction 用户给出的长期指令（例如「回答都用中文」）
  没有值得记住的内容就输出 []。
  不要输出任何解释性文字。

  用户：{question}
  助手：{answer}

  输出 JSON 数组：
